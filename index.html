    <title>🌙 Projeto Hades</title>
    <style>
        /*
        ### general ###
        */

        :root{
            --brand-one: #0a5f7f;
            --brand-two: #00d9c4;
            --brand-three: #ff6b35;
            --brand-four: #ffa500;
            --brand-five: #ffd700;
            --background: #142032;
            --btn-cool-innershadow: rgba(0,0,0,40%);
            --btn-cool-outershadow: rgba(100,100,100,70%);
            --btn-cool-primary: #00d9c4;
            --offwhite: #faf3f3;
            --blackpen: #121212;
            --bluepen: #292288;
        }

        body{
            height: 100%;
        }

        /* --- fonts --- */

        .material-symbols-outlined{
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24;
            user-select: none;
        }
        
        .tw-font, label{
        /* typewriter font */
            font-family: "Special Elite", system-ui;
            font-weight: 400;
            font-style: normal;
            font-size: 1.1em;
        }

        .cs-font{
        /* cursive font */
            font-family: "Tangerine", cursive;
            font-weight: 700;
            font-style: normal;
        }

        .bd-font {
        /* brand font */
            font-family: "Uncial Antiqua", system-ui;
            font-weight: 400;
            font-style: normal;
            font-size: 1.8em;
            text-shadow: 1px 1px 3px rgba(0,0,0,80%);
            color: var(--brand-five);
        }

        /* --- dropshadow --- */
        .ds-1{
            box-shadow: 7px 7px 10px rgba(0,0,0,20%);
        }

        /* --- materials --- */

        .wood-1{
        /* oak like wood */
            color: var(--blackpen);
            background-image: url(https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fi.pinimg.com%2Foriginals%2Fc0%2Fae%2F66%2Fc0ae667b522cbee616623a4575d1b7d4.jpg&f=1&nofb=1&ipt=0acb9406383c205ddba33c9b76fea16dcf0eb6d7b1c914bdd76194f78f66e397);
        }

        .wood-2{
        /* darker wood */
            background-color: #964629;
            background-image: url(https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fimg.freepik.com%2Fpremium-photo%2Forange-wood-texture-large-textured-wood-ash-tree-is-painted-orange-orange-ash_418821-3736.jpg&f=1&nofb=1&ipt=61b57a9d1264b21499319c73de2f20ce003ce25e341f8b5332576fa4aa2a6b2c);
        }

        .paper-1{
        /* slightly crumbled paper */
            background-color: var(--offwhite);
            background-image: url(https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fwallpapers.com%2Fimages%2Fhd%2Fpaper-texture-background-zlvqcgwohwvd642j.jpg&f=1&nofb=1&ipt=43e92fca9abe8d607b6fdee3666cbe59ff1eaef53ddc6a5ee616312f571d135b);
            background-size: cover;
            background-position: 0% 50%;
        }

        .paper-2{
        /* recycled paper */
            background-image: url(https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Funblast.com%2Fwp-content%2Fuploads%2F2022%2F01%2FPaper-Texture-4.jpg&f=1&nofb=1&ipt=5a588833eb8db1673e403bd02ee41282b959b75d7c75b400df7f07479bb65f02);
            background-size: cover;
        }

        /* --- pushable button :p --- */

        .btn-cool{
            margin-left: 10px;
            padding: 7px 9px;
            border-radius: 10px;
            border: 0px;
            position: relative;
            top: -4px;
            transition: 
            box-shadow .2s ease-in-out,
            top .2s ease-in-out;
        }

        .btn-cool-primary{
            color: #ffffff;
            background-color: var(--btn-cool-primary);
            box-shadow:
            inset 0px 2px rgba(255,255,255,60%),
            0px 6px rgba(0,0,0,20%),
            0px 6px var(--btn-cool-primary),
            0px 6px 0px 2px var(--btn-cool-innershadow),
            0px 6px 0px 4px var(--btn-cool-outershadow);
        }

        .btn-cool-primary:hover{
            box-shadow:
            inset 0px 1px rgba(255,255,255,60%),
            0px 2px rgba(0,0,0,20%),
            0px 2px var(--btn-cool-primary),
            0px 2px 0px 2px var(--btn-cool-innershadow),
            0px 2px 0px 4px var(--btn-cool-outershadow);
            top: 0px;
        }

        /* --- gambling board --- */

        .board{
            background-size: cover;
            border: transparent;
            border-radius: 10px;
            z-index: 5;
            width: 100%;
            height: 100%;
            box-shadow:
            0px 0px 8px 4px rgba(0,0,0,25%),
            inset 6px 6px rgba(255,255,255,15%),
            inset -6px -6px rgba(0,0,0,15%);
        }

        .board-inner{
            background-image: url(https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fstatic.vecteezy.com%2Fsystem%2Fresources%2Fpreviews%2F021%2F317%2F384%2Flarge_2x%2Fbrown-color-velvet-fabric-texture-used-as-background-empty-brown-fabric-background-of-soft-and-smooth-textile-material-there-is-space-for-text-free-photo.jpg&f=1&nofb=1&ipt=1ceb54814e210a5c2bf3de35e62b825ebfb69eff9fe537f19a8e9284fe12c236);
            background-size: cover;
            box-shadow: 
            inset 0px 0px 8px 4px rgba(0,0,0,35%),
            0px 0px 2px 4px rgba(0,0,0,20%),
            inset 4px 4px 8px rgba(0,0,0,10%),
            -4px -4px 2px rgba(0,0,0,10%);
            width: 100%;
            height: 100%;
            border: transparent;
            border-radius: 5px;
        }

        /* --- polaroid --- */

        .polaroid{
            position: relative;
            z-index: 10;
            border-radius: 2px;
            background-color: var(--offwhite);
            padding-top: 100%;
            top: 1vh;
            opacity: 100%;
            transition: opacity .2s ease-in-out;
        }

        .polaroid-inner{
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }

        .polaroid-picture{
            object-fit: cover;
            object-position: 50% 1%;
            width: 85%;
            height: 65%;
        }
        
        .polaroid-text{
            border: 0px;
            text-align: center;
            height: 20%;
            width: 100%;
            background-color: transparent;
            font-size: 1.8em;
        }

        .polaroid-text:focus{
            outline: none;
        }
    
        /* 
        ### navbar ###
        */

        #navbar{
            background-image: url(https://i.pinimg.com/1200x/54/ea/df/54eadf0e65bafb86cf7b6535c04e00fc.jpg);
            background-size: 40%;
            background-position: 30% 15%;

        /* 
        ### photo + name ###
        */

        #char-polaroid{

        }

        /* 
        ### detail + status ###
        */

        /* --- basic details --- */

        #char-detail{

            rotate: 1deg;
            z-index: 1;
            border: transparent;
            border-radius: 1px;
        }

        .detail-input:focus{

        /* --- status indicators --- */

        .status-indicator{
            font-size: 1.2em;
            font-variation-settings:
            'FILL' 0,
            'wght' 800 !important;
        }

        .status-available-health{

            cursor: pointer;
        }

        .status-available-sanity{

            font-variation-settings:

            cursor: pointer;
        }

        .status-available-energy{
            color: #efb30e;
            font-variation-settings:
            'FILL' 0;
            cursor: pointer;
        }

        .status-disabled-symbol{
            color: var(--blackpen);
            font-variation-settings:
            'FILL' 0 !important;
            cursor: default;
        }

        .status-filled{
            font-variation-settings:
            'FILL' 1 !important;
        }

        /*
        ### effects ###
        */

        #effects{
            rotate: -1deg;
            border: transparent;
            border-radius: 10px;
        }

        .bl{
        /* border left */
            position: absolute;
            border-left: solid 2px var(--blackpen);
            height: 100%;
        }

        .bb{
        /* border bottom */
            border-bottom: solid 2px var(--blackpen);
            width: 100%;
        }
    </style>

    <script>
        var maxHealth = document.getElementById("max-health")
        var currentHealth = document.getElementById("current-health")
        var healthIndicator = []

        var maxSanity = document.getElementById("max-sanity")
        var currentSanity = document.getElementById("current-sanity")
        var sanityIndicator = []

        var maxEnergy = document.getElementById("max-energy")
        var currentEnergy = document.getElementById("current-energy")
        var energyIndicator = []

        for (let i = 1; i <= 20; i++){
            healthIndicator.push("h" + i)
            sanityIndicator.push("s" + i)
            energyIndicator.push("e" + i)
        }
        
        function updateVitals(){
            for (let i = 0; i < 20; i++){
                if(i < maxHealth.value){
                    document.getElementById(healthIndicator[i]).classList.remove('status-disabled-symbol')
                    document.getElementById(healthIndicator[i]).innerHTML = 'circle'
                    document.getElementById(healthIndicator[i]).classList.add('status-available-health')
                    if(currentHealth.value > i){
                        document.getElementById(healthIndicator[i]).classList.add('status-filled')
                    } else {
                        document.getElementById(healthIndicator[i]).classList.remove('status-filled')
                    }
                } else {
                    document.getElementById(healthIndicator[i]).classList.add('status-disabled-symbol')
                    document.getElementById(healthIndicator[i]).classList.remove('status-filled')
                    document.getElementById(healthIndicator[i]).classList.remove('status-available-health')
                    document.getElementById(healthIndicator[i]).innerHTML = 'fiber_manual_record'
                }

                if(i < maxSanity.value){
                    document.getElementById(sanityIndicator[i]).classList.remove('status-disabled-symbol')
                    document.getElementById(sanityIndicator[i]).innerHTML = 'circle'
                    document.getElementById(sanityIndicator[i]).classList.add('status-available-sanity')
                    if(currentSanity.value > i){
                        document.getElementById(sanityIndicator[i]).classList.add('status-filled')
                    } else {
                        document.getElementById(sanityIndicator[i]).classList.remove('status-filled')
                    }
                } else {
                    document.getElementById(sanityIndicator[i]).classList.add('status-disabled-symbol')
                    document.getElementById(sanityIndicator[i]).classList.remove('status-filled')
                    document.getElementById(sanityIndicator[i]).classList.remove('status-available-sanity')
                    document.getElementById(sanityIndicator[i]).innerHTML = 'fiber_manual_record'
                }

                if(i < maxEnergy.value){
                    document.getElementById(energyIndicator[i]).classList.remove('status-disabled-symbol')
                    document.getElementById(energyIndicator[i]).innerHTML = 'circle'
                    document.getElementById(energyIndicator[i]).classList.add('status-available-energy')
                    if(currentEnergy.value > i){
                        document.getElementById(energyIndicator[i]).classList.add('status-filled')
                    } else {
                        document.getElementById(energyIndicator[i]).classList.remove('status-filled')
                    }
                } else {
                    document.getElementById(energyIndicator[i]).classList.add('status-disabled-symbol')
                    document.getElementById(energyIndicator[i]).classList.remove('status-filled')
                    document.getElementById(energyIndicator[i]).classList.remove('status-available-energy')
                    document.getElementById(energyIndicator[i]).innerHTML = 'fiber_manual_record'
                }
            }
        }

        updateVitals()
    </script>
  </body>
</html>
